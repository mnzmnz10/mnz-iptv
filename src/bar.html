<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';" />
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden;
      font: 14px "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; color: #eef2f8; user-select: none; }
    #bar { position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px;
      padding: 28px 26px 16px;
      background: linear-gradient(to top, rgba(6,8,12,.95), rgba(6,8,12,.6) 65%, rgba(6,8,12,0)); height: 100%; }
    button { font: inherit; color: #eef2f8; background: rgba(27,34,49,.8); border: 1px solid #2a3345;
      width: 42px; height: 42px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center;
      font-size: 17px; cursor: pointer; transition: .15s ease; backdrop-filter: blur(4px); flex: 0 0 auto; }
    button:hover { border-color: #6aa07a; background: rgba(74,124,89,.32); color: #a6d8b4; }
    button:active { transform: translateY(1px); }
    #pause { width: 48px; height: 48px; font-size: 19px; background: linear-gradient(135deg, #4a7c59, #3a6247);
      border: none; color: #fff; box-shadow: 0 6px 16px rgba(74,124,89,.45); }
    #pause:hover { filter: brightness(1.12); color: #fff; }
    #exit { border-color: #6aa07a; }
    .title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600;
      font-size: 15px; text-shadow: 0 2px 6px rgba(0,0,0,.8); }
    #seek { flex: 2; }
    #vol { width: 130px; }
    .time { font-size: 12px; min-width: 96px; text-align: center; color: #cbd5e1;
      font-variant-numeric: tabular-nums; text-shadow: 0 1px 3px #000; }
    input[type=range] { accent-color: #4a7c59; }
    select.trk { font: inherit; color: #eef2f8; background: rgba(27,34,49,.9); border: 1px solid #2a3345;
      border-radius: 10px; padding: 8px 10px; max-width: 150px; cursor: pointer; }
    select.trk:hover { border-color: #6aa07a; }
    select.trk option { background: #141926; }
    #info.on { background: rgba(74,124,89,.5); border-color: #6aa07a; }
    #barInfo { position: absolute; left: 26px; bottom: 84px; display: flex; flex-wrap: wrap; gap: 8px 18px;
      max-width: 620px; padding: 12px 16px; border-radius: 12px; background: rgba(6,8,12,.82); backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.14); font-size: 12.5px; color: #cbd5e1; text-shadow: 0 1px 2px #000; }
    #barInfo.hidden { display: none; }
    #barInfo b { color: #fff; font-weight: 700; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
  <div id="barInfo" class="hidden"></div>
  <div id="bar">
    <span class="title" id="title"></span>
    <button id="pause"><svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg></button>
    <button id="back" title="10 sn geri">⟲</button>
    <button id="fwd" title="10 sn ileri">⟳</button>
    <input type="range" id="seek" min="0" max="1000" value="0" />
    <span class="time" id="time">0:00 / 0:00</span>
    <span>🔊</span>
    <input type="range" id="vol" min="0" max="100" value="50" />
    <select id="audioSel" class="trk hidden" title="Dublaj / ses dili"></select>
    <select id="subSel" class="trk hidden" title="Altyazı dili"></select>
    <button id="info" title="Video bilgisi">ⓘ</button>
    <button id="exit" title="Tam ekrandan çık (Esc)">⤢</button>
  </div>
  <script src="bar.js"></script>
</body>
</html>
